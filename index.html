<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fredo Skates</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <div id="game-container">

      <!-- Header banner -->

      <header id="game-header">
        <img
          id="header-banner"
          src="images/fredoskates.png"
          alt="Fredo Skates"
          draggable="false"
        >
      </header>

      <!-- Scoreboard -->

      <section id="scoreboard">

        <div class="score-item">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>

        <div class="score-item coin-score">

          <img
            class="score-coin"
            src="images/coin.png"
            alt=""
            draggable="false"
          >

          <span class="score-label">Coins</span>
          <span id="coin-count" class="score-value">0</span>

        </div>

        <div class="score-item">
          <span class="score-label">High Score</span>
          <span id="high-score" class="score-value">0</span>
        </div>

      </section>

      <!-- Game -->

      <section
        id="game-area"
        class="game-paused"
        tabindex="0"
        aria-label="Fredo Skates game"
      >

        <!-- Static sky -->

        <div class="sky-layer">

          <div class="sun"></div>

          <div class="cloud cloud-one"></div>
          <div class="cloud cloud-two"></div>
          <div class="cloud cloud-three"></div>

        </div>

        <!-- Scrolling distant buildings -->

        <div
          id="far-city-scroll"
          class="scroll-layer far-city-scroll"
        >

          <div class="scroll-copy">

            <div class="far-city">

              <div class="far-building far-building-one"></div>
              <div class="far-building far-building-two"></div>
              <div class="far-building far-building-three"></div>
              <div class="far-building far-building-four"></div>
              <div class="far-building far-building-five"></div>
              <div class="far-building far-building-six"></div>

            </div>

          </div>

          <div class="scroll-copy">

            <div class="far-city">

              <div class="far-building far-building-one"></div>
              <div class="far-building far-building-two"></div>
              <div class="far-building far-building-three"></div>
              <div class="far-building far-building-four"></div>
              <div class="far-building far-building-five"></div>
              <div class="far-building far-building-six"></div>

            </div>

          </div>

        </div>

        <!-- Scrolling main city -->

        <div
          id="city-scroll"
          class="scroll-layer city-scroll"
        >

          <div class="scroll-copy">

            <div class="city-background">

              <div class="building building-one"></div>
              <div class="building building-two"></div>
              <div class="building building-three"></div>
              <div class="building building-four"></div>
              <div class="building building-five"></div>

            </div>

          </div>

          <div class="scroll-copy">

            <div class="city-background">

              <div class="building building-one"></div>
              <div class="building building-two"></div>
              <div class="building building-three"></div>
              <div class="building building-four"></div>
              <div class="building building-five"></div>

            </div>

          </div>

        </div>

        <!-- Scrolling street decorations -->

        <div
          id="street-scroll"
          class="scroll-layer street-scroll"
        >

          <div class="scroll-copy">

            <div class="street-decoration tree decoration-one">
              <span class="tree-top"></span>
              <span class="tree-trunk"></span>
            </div>

            <div class="street-decoration lamp decoration-two">
              <span class="lamp-light"></span>
            </div>

            <div class="street-decoration bench decoration-three"></div>

            <div class="street-decoration tree decoration-four">
              <span class="tree-top"></span>
              <span class="tree-trunk"></span>
            </div>

          </div>

          <div class="scroll-copy">

            <div class="street-decoration tree decoration-one">
              <span class="tree-top"></span>
              <span class="tree-trunk"></span>
            </div>

            <div class="street-decoration lamp decoration-two">
              <span class="lamp-light"></span>
            </div>

            <div class="street-decoration bench decoration-three"></div>

            <div class="street-decoration tree decoration-four">
              <span class="tree-top"></span>
              <span class="tree-trunk"></span>
            </div>

          </div>

        </div>

        <!-- Scrolling sidewalk and road -->

        <div
          id="foreground-scroll"
          class="scroll-layer foreground-scroll"
        >

          <div class="scroll-copy">

            <div class="sidewalk"></div>
            <div class="curb"></div>

            <div class="road">
              <span class="road-mark road-mark-one"></span>
              <span class="road-mark road-mark-two"></span>
              <span class="road-mark road-mark-three"></span>
              <span class="road-mark road-mark-four"></span>
            </div>

          </div>

          <div class="scroll-copy">

            <div class="sidewalk"></div>
            <div class="curb"></div>

            <div class="road">
              <span class="road-mark road-mark-one"></span>
              <span class="road-mark road-mark-two"></span>
              <span class="road-mark road-mark-three"></span>
              <span class="road-mark road-mark-four"></span>
            </div>

          </div>

        </div>

        <!-- Obstacles created by JavaScript -->

        <div id="obstacles"></div>

        <!-- Player -->

        <div id="player">

          <div class="player-shadow"></div>

<img
  id="skater-image"
  class="skater-sprite normal-skater"
  src="images/skater.png"
  alt="Skateboarder"
  draggable="false"
>

<img
  id="skater-grab-image"
  class="skater-sprite grab-skater"
  src="images/skater-grab.png"
  alt=""
  draggable="false"
>

        </div>

        <!-- Coin reward -->

        <div id="coin-effect" aria-hidden="true">

          <img
            src="images/coin.png"
            alt=""
            draggable="false"
          >

          <span>+1</span>

        </div>

        <!-- Start and game-over screen -->

        <div id="start-screen">

          <div class="start-card">

            <p class="start-eyebrow">
              Endless Skate Challenge
            </p>

            <h1 id="screen-title">
              Ready to Ride?
            </h1>

            <p id="screen-message">
              Jump over obstacles and ride up ramps.
            </p>

            <button
              id="start-button"
              type="button"
            >
              Start Riding
            </button>

            <div class="controls">

              <span>
                <kbd>Space</kbd>
                Jump
              </span>

              <span>
                <kbd>↑</kbd>
                Jump
              </span>

              <span>
                Click or tap to jump
              </span>

            </div>

          </div>

        </div>

      </section>

      <footer id="game-footer">
        Jump obstacles, collect coins and launch from ramps.
      </footer>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
